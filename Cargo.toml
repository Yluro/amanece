[package]
name = "amanece"
version = "0.2.0"
edition = "2024"
description = "TUI to browse ALBA BL13-XALOC autoprocessing results over SFTP and fetch HKL files"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
regex = "1.13.1"
roxmltree = "0.21.1"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
trash = "5.2.9"
vt100 = "0.18.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_SystemInformation", "Win32_UI_WindowsAndMessaging"] }
